name: build-and-deploy-to-aliyun
displayName: '构建并部署到阿里云'

# ---------------------------------------------------
#  变量定义：将常变的信息放在这里，方便维护
# ---------------------------------------------------
variables:
  # 1. 您的阿里云ACR实例地址
  # 获取路径：ACR控制台 -> 实例列表 -> 个人版实例 -> 概览 -> 公网地址
  ACR_REGISTRY: 'crpi-iyq1iqfffn9ehscp.cn-beijing.personal.cr.aliyuncs.com' # <-- 修改为您的地址

  # 2. 您的ACR命名空间
  # 获取路径：ACR控制台 -> 实例列表 -> 个人版实例 -> 仓库管理 -> 命名空间
  ACR_NAMESPACE: 'com_3mx' # <-- 修改为您的命名空间

  # 3. 您的应用镜像名称
  IMAGE_NAME: 'py_saas_platform' # <-- 修改为您的镜像名

  # 4. 您在 Gitee Go 中创建的主机组ID
  # 获取路径：Gitee Go -> 流水线 -> 主机管理
  HOST_GROUP_ID: 'iZ2zehybl9f95cso6ycl5hZ' # <-- 修改为您的主机组ID

  # 5. 您希望在服务器上运行的容器名称
  CONTAINER_NAME: 'saas_platform' # <-- 自定义容器名

# ---------------------------------------------------
#  触发器：当代码推送到 main 分支时自动执行
# ---------------------------------------------------
triggers:
  push:
    - branch: master # 您也可以改为 master 或其他分支

# ---------------------------------------------------
#  流水线阶段与步骤
# ---------------------------------------------------
stages:
  # 阶段一：构建并推送Docker镜像
  - stage:
      name: build-and-push-image
      displayName: '构建并推送镜像到阿里云ACR'
      failFast: true # 任何一步失败则终止
      steps:
        - step: build-and-push@docker # 使用Gitee Go官方的Docker构建任务
          name: build-push-to-acr
          displayName: '构建并推送镜像'
          inputs:
            # 使用我们在第一步中创建的凭证ID
            dockerCredentials: ALIYUN_ACR_CREDENTIALS
            # Dockerfile 所在的上下文路径，'.' 表示项目根目录
            context: .
            # Dockerfile 的文件名
            dockerfile: Dockerfile
            # 构建的完整镜像名和标签。
            # 格式: <ACR地址>/<命名空间>/<镜像名>:<标签>
            # 使用 Gitee Go 的内置变量 ${CICD_GIT_COMMIT_SHORT_ID} 作为标签，保证每次构建的镜像标签唯一
            imageName: '${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:${CICD_GIT_COMMIT_SHORT_ID}'

  # 阶段二：登录ECS并部署容器
  - stage:
      name: deploy-to-ecs
      displayName: '部署到阿里云ECS'
      failFast: true
      steps:
        - step: deploy@agent # 使用Gitee Go官方的Agent部署任务
          name: execute-deploy-script
          displayName: '在ECS上执行部署脚本'
          inputs:
            # 指定要部署的主机组
            hostGroupID: ${HOST_GROUP_ID}
            # 在远程ECS上执行的Shell脚本
            goals: |
              set -e # 开启错误检查，任何命令失败则脚本终止

              echo "====== 1. 登录到阿里云ACR ======"
              # 使用Gitee Go注入的环境变量来登录，这些变量来自于您配置的 `ALIYUN_ACR_CREDENTIALS` 凭证
              docker login --username=${ALIYUN_ACR_CREDENTIALS_USERNAME} --password=${ALIYUN_ACR_CREDENTIALS_PASSWORD} ${ACR_REGISTRY}

              echo "====== 2. 拉取最新的镜像 ======"
              IMAGE_FULL_NAME="${ACR_REGISTRY}/${ACR_NAMESPACE}/${IMAGE_NAME}:${CICD_GIT_COMMIT_SHORT_ID}"
              docker pull ${IMAGE_FULL_NAME}

              echo "====== 3. 停止并删除旧的容器(如果存在) ======"
              # 查询是否存在同名容器，如果存在则停止并删除，这能保证脚本重复执行不出错
              if [ "$(docker ps -a -q -f name=^/${CONTAINER_NAME}$)" ]; then
                  echo "发现旧容器，正在停止并删除..."
                  docker stop ${CONTAINER_NAME}
                  docker rm ${CONTAINER_NAME}
              fi

              echo "====== 4. 启动新的应用容器 ======"
              # -d: 后台运行
              # --name: 指定容器名，方便管理
              # -p 80:5000: 将服务器的80端口映射到容器的5000端口
              # --restart=always: 保证容器异常退出或服务器重启后能自动重启
              docker run -d --name ${CONTAINER_NAME} \
                -p 80:5000 \
                --restart=always \
                ${IMAGE_FULL_NAME}

              echo "====== 5. 清理无用的旧镜像 ======"
              # 清理掉那些没有被任何容器使用的、被悬空的镜像，节省磁盘空间
              docker image prune -af

              echo "====== 部署成功! ======"