[alembic]
# 指定 Alembic 脚本目录
script_location = alembic

# 这里的连接串仅作为占位，实际运行时会在 env.py 中覆盖
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/saas_platform_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
