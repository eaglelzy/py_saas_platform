# 使用 Docker Compose 编排开发环境所需的全部服务
services:
  app:
    # 构建后端应用镜像，直接复用根目录下的 Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai  # 统一容器时区为东八区
    # 使用开发环境变量文件，便于本地调试
    env_file:
      - env/.env.development
    # 暴露 FastAPI 服务端口
    ports:
      - "8000:8000"
    # 挂载源代码以支持热重载
    volumes:
      - ./:/app
      - /etc/localtime:/etc/localtime:ro  # 挂载宿主机时区配置
    # 等待依赖服务准备就绪
    depends_on:
      - postgres
      - redis
      - rabbitmq
    # 采用开发模式启动，启用自动重载
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  postgres:
    # 使用官方 PostgreSQL 镜像，提供持久化数据库
    image: postgres:14-alpine
    # 设置数据库初始凭据
    environment:
      POSTGRES_DB: saas_platform_dev  # 初始化数据库名称
      POSTGRES_USER: postgres  # 数据库用户名
      POSTGRES_PASSWORD: postgres  # 数据库密码
      TZ: Asia/Shanghai  # 保持容器时区与宿主一致
    # 映射数据库端口，方便外部工具调试
    ports:
      - "5432:5432"
    # 挂载数据卷，保证容器销毁后数据仍保留
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro  # 挂载宿主机时区文件

  redis:
    # 使用官方 Redis 镜像，暂采用无密码配置供开发测试
    image: redis:7-alpine
    environment:
      TZ: Asia/Shanghai  # 保持 Redis 容器时间与宿主一致
    # 映射默认端口以便必要时外部连接
    ports:
      - "6379:6379"
    # 通过命令显式启用持久化策略
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    # 挂载数据卷，保存 Redis 快照
    volumes:
      - redis_data:/data
      - /etc/localtime:/etc/localtime:ro  # 同步宿主机时区

  rabbitmq:
    # 使用带管理界面的 RabbitMQ 镜像，方便查看队列状态
    image: rabbitmq:3.13-management
    # 配置默认账号与密码
    environment:
      RABBITMQ_DEFAULT_USER: guest  # 队列用户名
      RABBITMQ_DEFAULT_PASS: guest  # 队列密码
      TZ: Asia/Shanghai  # 保持 RabbitMQ 容器时间一致
    # 映射 AMQP 与管理界面的端口
    ports:
      - "5672:5672"
      - "15672:15672"
    # 挂载队列数据，避免重启后丢失消息
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - /etc/localtime:/etc/localtime:ro  # 同步宿主机时区

volumes:
  # PostgreSQL 数据卷定义
  postgres_data:
  # Redis 数据卷定义
  redis_data:
  # RabbitMQ 数据卷定义
  rabbitmq_data:
