# 设置项目名称，这将作为所有容器名称的前缀
name: study-assistant

services:
  # 留学助手应用
  app:
    build: .
    container_name: app
    ports:
      # 使用 .env 文件中定义的端口
      - "${APP_PORT:-3001}:8000"
    environment:
      # --- 从 .env 文件中读取变量 ---
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - PROJECT_NAME=${PROJECT_NAME}
      # --- 硬编码的环境变量 ---
      - ENV=development
      - DEBUG=true
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - study-network
    depends_on:
      - db
      - redis

  # 留学助手数据库
  db:
    image: postgres:14-alpine
    container_name: db
    environment:
      # 从 .env 文件中读取数据库配置
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - study_db_data:/var/lib/postgresql/data
      # 您之前的 init.sql 挂载保持不变
      # - ./scripts/init_study_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # 使用 .env 文件中定义的端口
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    networks:
      - study-network

  # 留学助手 Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      # 使用 .env 文件中定义的端口
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    networks:
      - study-network

networks:
  study-network:
    driver: bridge

volumes:
  study_db_data: