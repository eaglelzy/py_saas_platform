name: study-assistant
services:
  app:
    # 镜像全名将由 CI/CD 流程通过环境变量注入
    # crpi-iyq1iqfffn9ehscp.cn-beijing.personal.cr.aliyuncs.com/eaglelzy/saas_platform
    image: ${IMAGE_NAME_WITH_TAG}
    container_name: app
    restart: always
    ports:
      - "${APP_PORT:-8080}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - PROJECT_NAME=${PROJECT_NAME}
      - ENV=${ENV:-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - app-network
    depends_on:
      - db
      - redis

  db:
    image: postgres:14-alpine
    container_name: db
    restart: always
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # 挂载初始化脚本
      - ./scripts/init-database.sql:/docker-entrypoint-initdb.d/01-init-database.sql
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
