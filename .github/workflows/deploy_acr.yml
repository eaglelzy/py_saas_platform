name: Build, Push to ACR, and Deploy to ECS

on:
  push:
    branches: [ "main" ]

jobs:
  # --- 任务一：构建并推送镜像 (已优化) ---
  build-and-push-image:
    runs-on: ubuntu-latest
    # 定义任务的输出
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 新增步骤：使用 metadata-action 自动生成镜像标签
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 指定要生成的镜像名称
          images: ${{ secrets.ACR_REGISTRY }}/eaglelzy/saas_platform
          # 定义标签格式：使用 commit SHA 作为标签，这是最佳实践
          tags: type=sha,prefix=

      # 修改步骤：使用上一步生成的标签来构建和推送
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 直接使用 meta 步骤的输出
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # --- 任务二：部署到 ECS 实例 (修正了变量引用) ---
  deploy-to-ecs:
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Alibaba Cloud ECS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ECS_SERVER_IP }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            # 修正：从 needs 上下文中正确获取上一个任务的输出
            IMAGE_TAG="${{ needs.build-and-push-image.outputs.image_tags }}"
            CONTAINER_NAME="saas_platform_container"

            echo "--- Starting Deployment ---"
            echo "Image to deploy: $IMAGE_TAG" # 这里现在应该能正确打印出镜像标签了

            docker login --username=${{ secrets.ACR_USERNAME }} --password=${{ secrets.ACR_PASSWORD }} ${{ secrets.ACR_REGISTRY }}
            docker pull $IMAGE_TAG

            if [ "$(docker ps -q -f name=$CONTAINER_NAME)" ]; then
                echo "Stopping and removing existing container..."
                docker stop $CONTAINER_NAME
                docker rm $CONTAINER_NAME
            fi

            echo "Starting new container..."
            docker run -d --name $CONTAINER_NAME -p 8000:8000 $IMAGE_TAG

            docker image prune -f

            echo "--- Deployment Successful ---"