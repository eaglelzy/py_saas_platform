name: Build, Push, and Deploy Production

on:
  push:
    branches:
      - 'release/*'
    tags:
      - 'v*'

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      image_name: ${{ secrets.ACR_REGISTRY }}/eaglelzy/saas_platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate safe tag name
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            SAFE_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//_/g')
            echo "tag=$SAFE_TAG" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.outputs.image_name }}:${{ steps.outputs.image_tag }}

  deploy-to-prod-server:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Production Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ECS_SERVER_IP }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            # 导航到服务器上的项目目录
            cd /path/to/your/project/py_saas_platform

            # 拉取最新的代码 (为了获取最新的 docker-compose.prod.yml)
            echo "--- Pulling latest source code ---"
            git pull

            # 设置部署所需的环境变量 (从 GitHub Secrets 读取)
            export IMAGE_NAME_WITH_TAG="${{ needs.build-and-push-image.outputs.image_name }}:${{ needs.build-and-push-image.outputs.image_tag }}"
            export APP_PORT=${{ secrets.PROD_APP_PORT }}
            export DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            export SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
            export PROJECT_NAME="智能申校助手"
            export POSTGRES_DB=${{ secrets.PROD_POSTGRES_DB }}
            export POSTGRES_USER=${{ secrets.PROD_POSTGRES_USER }}
            export POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}

            # 登录到镜像仓库
            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username=${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}

            # 使用 docker-compose 拉取 app 服务的新镜像
            echo "--- Pulling new application image ---"
            docker-compose -f docker-compose.prod.yml pull app

            # 运行数据库迁移
            echo "--- Running database migrations ---"
            docker-compose -f docker-compose.prod.yml run --rm app alembic upgrade head

            # 使用 docker-compose 部署整个应用栈
            echo "--- Deploying new version ---"
            docker-compose -f docker-compose.prod.yml up -d

            # 清理不再使用的旧镜像
            echo "--- Cleaning up old images ---"
            docker image prune -f

            echo "--- Deployment successful ---"
