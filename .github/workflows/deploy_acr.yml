name: Build, Push to ACR, and Deploy to ECS

on:
  push:
    branches: [ "main" ]

jobs:
  # --- 任务一：构建并推送镜像 ---
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 使用全局变量 github.sha 来构建唯一的镜像标签
          tags: ${{ secrets.ACR_REGISTRY }}/eaglelzy/saas_platform:${{ github.sha }}

  # --- 任务二：部署到 ECS 实例 ---
  deploy-to-ecs:
    # 依赖任务一成功完成
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Alibaba Cloud ECS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ECS_SERVER_IP }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          script: |
            # 保证脚本出错时立即退出
            set -e

            # 关键修复：使用与任务一完全相同的方式，独立地、可靠地重建镜像标签
            IMAGE_TAG="${{ secrets.ACR_REGISTRY }}/eaglelzy/saas_platform:${{ github.sha }}"
            CONTAINER_NAME="saas_platform_container"

            echo "--- Starting Deployment ---"
            echo "Image to deploy: $IMAGE_TAG" # 这一次，这里将正确打印出完整的镜像标签

            # 使用更安全的 password-stdin 方式登录
            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username=${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}

            # 拉取最新的镜像
            docker pull $IMAGE_TAG

            # 停止并删除可能存在的旧容器
            if [ "$(docker ps -q -f name=$CONTAINER_NAME)" ]; then
                echo "Stopping and removing existing container..."
                docker stop $CONTAINER_NAME
                docker rm $CONTAINER_NAME
            fi

            # 启动新容器
            echo "Starting new container..."
            docker run -d --name $CONTAINER_NAME -p 8000:8000 $IMAGE_TAG

            # 清理无用的旧镜像
            docker image prune -f

            echo "--- Deployment Successful ---"