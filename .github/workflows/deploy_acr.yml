# 工作流的名称
name: Build and Push to Alibaba Cloud ACR

# 触发工作流的事件
# 这里设置为：当有代码推送到 main 分支时触发
on:
  push:
    branches: [ "main" ]

# 工作流包含的任务 (jobs)
jobs:
  build-and-push-image:
    # 任务运行的虚拟机环境，使用最新的 Ubuntu 系统
    runs-on: ubuntu-latest

    # 任务包含的步骤 (steps)
    steps:
      # 第一步：检出代码
      # 这是官方的 action，作用是把你的仓库代码下载到虚拟机里
      - name: Checkout repository
        uses: actions/checkout@v4

      # 第二步：登录到阿里云 ACR
      # 这是 Docker 官方提供的 action，专门用于登录各种镜像仓库
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          # 引用我们之前在 GitHub Secrets 中设置好的凭证
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 第三步：构建并推送 Docker 镜像
      # 这是 Docker 官方提供的 action，用于构建和推送镜像，功能非常强大
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Dockerfile 的上下文路径，. 表示项目根目录
          file: ./Dockerfile # Dockerfile 的具体路径
          push: true # 设置为 true，表示构建成功后立即推送
          # 设置镜像的标签。这是一个最佳实践：
          # 使用 ACR 仓库地址/命名空间/仓库名:commit哈希值
          # 每次推送的镜像都有一个唯一的、可追溯的标签
          tags: ${{ secrets.ACR_REGISTRY }}/eaglelzy/saas_platform:${{ github.sha }}