name: Build, Push, and Deploy to ECS

on:
  push:
    branches:
      - 'release/*'
    tags:
      - 'v*'            # Trigger on pushes of tags that start with 'v' (e.g., v1.0, v1.0.1)

jobs:
  # --- 任务一：构建并推送镜像 ---
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 标签逻辑：如果是 release 分支，则使用分支名作为标签；如果是 tag，则使用 tag 名作为标签；如果是其他分支，则使用 sha 作为标签
          tags: >
            ${{ secrets.ACR_REGISTRY }}/eaglelzy/saas_platform:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name 
              || startsWith(github.ref, 'refs/heads/release/') && github.ref_name || github.sha }}

  # --- 任务二：部署到 ECS 实例 ---
  deploy-to-ecs:
    if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/')
    needs: build-and-push-image
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Alibaba Cloud ECS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ECS_SERVER_IP }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            IMAGE_VERSION_TAG="${{ github.ref_name }}"
            if [[ ${{ startsWith(github.ref, 'refs/heads/release/') }} ]]; then
              CONTAINER_NAME="saas_platform_test"
            else
              CONTAINER_NAME="saas_platform_prod}"
            fi

            FULL_IMAGE_TAG="${{ secrets.ACR_REGISTRY }}/eaglelzy/saas_platform:${IMAGE_VERSION_TAG//\//_}" #将斜杠替换为下划线，以便创建合法的命名
            SHORT_IMAGE_NAME="saas_platform:${IMAGE_VERSION_TAG}"
            CONTAINER_NAME="saas_platform_container"

            echo "--- Starting RELEASE Deployment ---"
            echo "Deploying version: ${IMAGE_VERSION_TAG}"
            echo "Full Image to deploy: $FULL_IMAGE_TAG"

            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username=${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}

            docker pull $FULL_IMAGE_TAG

            echo "Tagging image ${FULL_IMAGE_TAG} as ${SHORT_IMAGE_NAME}"
            docker tag $FULL_IMAGE_TAG $SHORT_IMAGE_NAME

            if [ "$(docker ps -q -f name=$CONTAINER_NAME)" ]; then
                echo "Stopping and removing existing container..."
                docker stop $CONTAINER_NAME
                docker rm $CONTAINER_NAME
            fi

            echo "Starting new container with ${SHORT_IMAGE_NAME}..."
            # Remember to map to the correct container port (e.g., 5000)
            docker run -d --name $CONTAINER_NAME -p 80:8000 $SHORT_IMAGE_NAME

            docker image prune -f

            echo "--- Deployment of ${SHORT_IMAGE_NAME} Successful ---"