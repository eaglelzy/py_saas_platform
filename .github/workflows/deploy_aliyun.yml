name: Deploy to Aliyun (Test & Production)

on:
  push:
    branches:
      - 'release/*'      # 推送到 release/* 分支触发测试环境部署
    tags:
      - 'v*'             # 推送版本标签触发生产环境部署
  workflow_dispatch:     # 手动触发
    inputs:
      environment:
        description: '选择部署环境'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - production

env:
  IMAGE_NAME: eaglelzy/saas_platform

jobs:
  # 确定部署环境
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image_tag: ${{ steps.tag.outputs.tag }}
      should_deploy: ${{ steps.env.outputs.should_deploy }}
    steps:
      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "environment=test" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=none" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate image tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/develop ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            SAFE_TAG=$(echo "${{ github.ref_name }}" | sed 's/\//_/g')
            echo "tag=$SAFE_TAG" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

  # 构建和推送镜像
  build-and-push:
    needs: determine-environment
    if: needs.determine-environment.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.prepare-output.outputs.image_uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.determine-environment.outputs.image_tag }}-${{ needs.determine-environment.outputs.environment }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ needs.determine-environment.outputs.environment }}
          cache-to: type=gha,mode=max,scope=${{ needs.determine-environment.outputs.environment }}

      - name: Prepare single-line image URI for output
        id: prepare-output
        run: |
          # 从 meta 的输出中提取第一行（也就是我们需要的那个tag），并去除任何换行符
          # 然后将其设置为这个新步骤的输出
          echo "image_uri=$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)" >> $GITHUB_OUTPUT

      - name: Print image URI
        run: |
          echo "IMAGE_URI: ${{ steps.prepare-output.outputs.image_uri }}"

  # 部署到测试环境
  deploy-test:
    needs: [determine-environment, build-and-push]
    if: needs.determine-environment.outputs.environment == 'test'
    runs-on: ubuntu-latest
    steps:
      # - name: Copy docker-compose file via scp
      #   uses: appleboy/scp-action@v1
      #   with:
      #     host: ${{ secrets.TEST_ECS_SERVER_IP }}
      #     username: ${{ secrets.TEST_ECS_USERNAME }}
      #     key: ${{ secrets.TEST_ECS_SSH_PRIVATE_KEY }}
      #     source: "docker-compose.prod.yml"
      #     target: "/www/wwwroot/saas_platform/test"
      #     # target: "${{ secrets.TEST_PROJECT_PATH || '/www/wwwroot/saas_platform/test' }}"
      - name: Print image tag
        run: |
          echo "IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}"

      # 关键步骤：在服务器上生成 .env 文件
      - name: Create .env file on ECS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ECS_SERVER_IP }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          script: |
            # 进入工作目录
            cd "${{ secrets.TEST_PROJECT_PATH || '/www/wwwroot/saas_platform/test' }}"
            # 使用 cat 和 heredoc 语法覆盖写入 .env 文件
            # 这种方法对于多行变量和特殊字符非常安全
            # postgresql://lizy:Lzy142857@db:5433/study_assitant_db_test
            echo "IMAGE_NAME_WITH_TAG: ${{ steps.meta.outputs.tags }}"
            echo "IMAGE_NAME_WITH_TAG: ${{ needs.build-and-push.outputs.image_uri }}"
            cat << EOF > .env
            IMAGE_NAME_WITH_TAG="${{ steps.meta.outputs.tags }}"
            APP_PORT=${{ secrets.TEST_APP_PORT || '8080' }}
            DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}
            SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}
            PROJECT_NAME="留学助手平台-测试环境"
            POSTGRES_DB=${{ secrets.TEST_POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.TEST_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.TEST_POSTGRES_PASSWORD }}
            ENV=test
            DEBUG=true
            LOG_LEVEL=DEBUG
            EOF


      - name: Deploy to Test Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.TEST_ECS_SERVER_IP }}
          username: ${{ secrets.TEST_ECS_USERNAME }}
          key: ${{ secrets.TEST_ECS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            echo "🚀 开始部署到测试环境..."
            
            # 导航到项目目录
            cd ${{ secrets.TEST_PROJECT_PATH || '/www/wwwroot/saas_platform/test' }}
            
            # 确保项目目录存在
            mkdir -p ${{ secrets.TEST_PROJECT_PATH || '/www/wwwroot/saas_platform/test' }}
            
            echo "📦 准备部署环境..."
            
            # 设置测试环境变量
            echo "🔍 调试信息："
            echo "镜像URI: ${{ needs.build-and-push.outputs.image_uri }}"
            export IMAGE_NAME_WITH_TAG="${{ needs.build-and-push.outputs.image_uri }}"
            echo "设置的镜像标签: $IMAGE_NAME_WITH_TAG"
            export APP_PORT=${{ secrets.TEST_APP_PORT || '8080' }}
            # postgresql://lizy:Lzy142857@db:5433/study_assitant_db_test
            export DATABASE_URL=${{ secrets.TEST_DATABASE_URL }}
            export SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}
            export PROJECT_NAME="留学助手平台-测试环境"
            export POSTGRES_DB=${{ secrets.TEST_POSTGRES_DB }}
            export POSTGRES_USER=${{ secrets.TEST_POSTGRES_USER }}
            export POSTGRES_PASSWORD=${{ secrets.TEST_POSTGRES_PASSWORD }}
            export ENV=test
            export DEBUG=true
            export LOG_LEVEL=DEBUG
            
            # 登录镜像仓库
            echo "🔐 登录镜像仓库..."
            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username=${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}
            
            # 拉取新镜像
            echo "📦 拉取新镜像..."
            docker-compose -f docker-compose.prod.yml pull app
            
            # 备份数据库
            echo "💾 备份数据库..."
            docker-compose -f docker-compose.prod.yml exec -T db pg_dump -U $POSTGRES_USER $POSTGRES_DB > backup_test_$(date +%Y%m%d_%H%M%S).sql || true
            
            # 运行数据库迁移
            echo "🔄 运行数据库迁移..."
            docker-compose -f docker-compose.prod.yml run --rm app alembic upgrade head || true
            
            # 部署应用
            echo "🚀 部署应用..."
            docker-compose -f docker-compose.prod.yml up -d
            
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 30
            
            # 健康检查
            echo "🏥 执行健康检查..."
            for i in {1..10}; do
              if curl -f http://localhost:$APP_PORT/health > /dev/null 2>&1; then
                echo "✅ 测试环境部署成功！"
                break
              fi
              echo "⏳ 等待服务启动... ($i/10)"
              sleep 10
            done
            
            # 清理旧镜像
            echo "🧹 清理旧镜像..."
            docker image prune -f
            
            echo "🎉 测试环境部署完成！"
            echo "📊 测试环境访问地址: http://${{ secrets.TEST_ECS_SERVER_IP}}:$APP_PORT"

  # 部署到生产环境
  deploy-production:
    needs: [determine-environment, build-and-push]
    if: needs.determine-environment.outputs.environment == 'production'
    runs-on: ubuntu-latest
    steps:
      # - name: Copy docker-compose file via scp
      #   uses: appleboy/scp-action@v1.0.0
      #   with:
      #     host: ${{ secrets.ECS_SERVER_IP }}
      #     username: ${{ secrets.ECS_USERNAME }}
      #     key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
      #     source: "docker-compose.prod.yml"
      #     target: "/www/wwwroot/saas_platform/prod"
      #     # target: "${{ secrets.PROD_PROJECT_PATH || '/www/wwwroot/saas_platform/prod' }}"
      - name: Deploy to Production Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ECS_SERVER_IP }}
          username: ${{ secrets.ECS_USERNAME }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            echo "🚀 开始部署到生产环境..."
            
            # 导航到项目目录
            cd ${{ secrets.PROD_PROJECT_PATH || '/www/wwwroot/saas_platform/prod' }}
            
            # 确保项目目录存在
            mkdir -p ${{ secrets.PROD_PROJECT_PATH || '/www/wwwroot/saas_platform/prod' }}
            
            echo "📦 准备生产环境部署..."
            
            # 设置生产环境变量
            echo "🔍 调试信息："
            echo "镜像URI: ${{ needs.build-and-push.outputs.image_uri }}"
            export IMAGE_NAME_WITH_TAG="${{ needs.build-and-push.outputs.image_uri }}"
            echo "设置的镜像标签: $IMAGE_NAME_WITH_TAG"
            export APP_PORT=${{ secrets.PROD_APP_PORT || '8888' }}
            export DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
            export SECRET_KEY=${{ secrets.PROD_SECRET_KEY }}
            export PROJECT_NAME="留学助手平台"
            export POSTGRES_DB=${{ secrets.PROD_POSTGRES_DB }}
            export POSTGRES_USER=${{ secrets.PROD_POSTGRES_USER }}
            export POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            export ENV=production
            export DEBUG=false
            export LOG_LEVEL=INFO
            
            # 登录镜像仓库
            echo "🔐 登录镜像仓库..."
            echo "${{ secrets.ACR_PASSWORD }}" | docker login --username=${{ secrets.ACR_USERNAME }} --password-stdin ${{ secrets.ACR_REGISTRY }}
            
            # 拉取新镜像
            echo "📦 拉取新镜像..."
            docker-compose -f docker-compose.prod.yml pull app
            
            # 备份数据库
            echo "💾 备份生产数据库..."
            docker-compose -f docker-compose.prod.yml exec -T db pg_dump -U $POSTGRES_USER $POSTGRES_DB > backup_prod_$(date +%Y%m%d_%H%M%S).sql
            
            # 运行数据库迁移
            echo "🔄 运行数据库迁移..."
            docker-compose -f docker-compose.prod.yml run --rm app alembic upgrade head
            
            # 优雅停止现有服务
            echo "⏹️ 优雅停止现有服务..."
            docker-compose -f docker-compose.prod.yml stop app
            
            # 部署新版本
            echo "🚀 部署新版本..."
            docker-compose -f docker-compose.prod.yml up -d
            
            # 等待服务启动
            echo "⏳ 等待服务启动..."
            sleep 60
            
            # 健康检查
            echo "🏥 执行健康检查..."
            for i in {1..15}; do
              if curl -f http://localhost:$APP_PORT/health > /dev/null 2>&1; then
                echo "✅ 生产环境部署成功！"
                break
              fi
              echo "⏳ 等待服务启动... ($i/15)"
              sleep 15
            done
            
            # 验证关键接口
            echo "🔍 验证关键接口..."
            curl -f http://localhost:$APP_PORT/api/v1/auth/test > /dev/null 2>&1 || echo "⚠️ 警告: 某些接口可能未正常响应"
            
            # 清理旧镜像
            echo "🧹 清理旧镜像..."
            docker image prune -f
            
            echo "🎉 生产环境部署完成！"
            echo "📊 生产环境访问地址: http://${{ secrets.ECS_SERVER_IP }}:$APP_PORT"

  # 部署后通知
  notify:
    needs: [determine-environment, deploy-test, deploy-production]
    if: always() && needs.determine-environment.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notify deployment status
        run: |
          if [[ "${{ needs.determine-environment.outputs.environment }}" == "test" ]]; then
            if [[ "${{ needs.deploy-test.result }}" == "success" ]]; then
              echo "✅ 测试环境部署成功！"
              echo "🌐 访问地址: http://${{ secrets.TEST_ECS_SERVER_IP }}:${{ secrets.TEST_APP_PORT || '8080' }}"
            else
              echo "❌ 测试环境部署失败！"
              echo "请检查部署日志进行故障排除"
            fi
          elif [[ "${{ needs.determine-environment.outputs.environment }}" == "production" ]]; then
            if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
              echo "✅ 生产环境部署成功！"
              echo "🌐 访问地址: http://${{ secrets.ECS_SERVER_IP }}:${{ secrets.PROD_APP_PORT || '8888' }}"
            else
              echo "❌ 生产环境部署失败！"
              echo "请立即检查生产环境状态并进行故障排除"
            fi
          fi
          
          # 这里可以添加更多通知方式，比如：
          # - 发送到钉钉群
          # - 发送到企业微信
          # - 发送邮件
          # - 发送到 Slack
